<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aikatauluohjelma – viivaesitys</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --line: #cbd5e1;
      --hour-width: 90px;
      --time-col-width: 140px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      margin-bottom: 20px;
    }

    h1, h2 { margin-top: 0; }

    .subtitle {
      color: var(--muted);
      margin-top: -8px;
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      color: var(--muted);
    }

    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
      background: white;
    }

    textarea {
      min-height: 42px;
      resize: vertical;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font: inherit;
      cursor: pointer;
      background: var(--accent);
      color: white;
    }

    button:hover { background: var(--accent-hover); }
    button.secondary { background: #475569; }
    button.secondary:hover { background: #334155; }
    button.danger { background: var(--danger); }
    button.danger:hover { background: #b91c1c; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      align-items: end;
      margin-bottom: 16px;
    }

    .search-box {
      max-width: 320px;
      width: 100%;
    }

    .view-note {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
    }

    .timeline-wrapper {
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .day-section {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      margin-bottom: 18px;
      overflow: hidden;
      background: #fff;
    }

    .day-header {
      padding: 14px 16px;
      background: #f8fafc;
      border-bottom: 1px solid #e5e7eb;
    }

    .day-title {
      font-size: 18px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .day-subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .timeline {
      padding: 20px 16px 24px;
    }

    .timeline-header,
    .timeline-row {
      display: grid;
      grid-template-columns: var(--time-col-width) auto;
    }

    .time-header-cell {
      border-right: 1px solid #e5e7eb;
      border-bottom: 2px solid var(--line);
      min-height: 34px;
    }

    .timeline-scale {
      position: relative;
      min-height: 34px;
      border-bottom: 2px solid var(--line);
    }

    .scale-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 0;
      border-left: 1px dashed #d5dbe3;
    }

    .scale-label {
      position: absolute;
      top: 0;
      left: 6px;
      font-size: 12px;
      color: var(--muted);
      background: #fff;
      padding-right: 6px;
      white-space: nowrap;
    }

    .timeline-row {
      min-height: 98px;
      border-bottom: 1px solid #eef2f7;
    }

    .timeline-row:last-child {
      border-bottom: none;
    }

    .event-time {
      padding: 14px 10px;
      font-size: 14px;
      font-weight: 700;
      border-right: 1px solid #e5e7eb;
      background: #fcfdff;
    }

    .event-track {
      position: relative;
      min-height: 98px;
    }

    .track-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 3px;
      background: var(--line);
      transform: translateY(-50%);
    }

    .track-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .track-grid .scale-line {
      border-left-color: #d5dbe3;
    }

    .event-box {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1;
      background: #dbeafe;
      border: 1px solid #93c5fd;
      border-radius: 12px;
      padding: 10px 12px;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.12);
      min-height: 52px;
      min-width: 120px;
    }

    .event-box strong {
      display: block;
      margin-bottom: 4px;
    }

    .event-meta {
      font-size: 13px;
      color: #334155;
      line-height: 1.35;
    }

    .event-notes {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .row-actions {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .row-actions button {
      font-size: 12px;
      padding: 6px 10px;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 24px;
    }

    @media print {
      body { background: white; }
      .no-print { display: none !important; }
      .container { max-width: 100%; padding: 0; }
      .card { box-shadow: none; border: none; padding: 0; }
      .day-section {
        break-inside: avoid;
        border: 1px solid #d1d5db;
        margin-bottom: 18px;
      }
      .event-box { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card no-print">
      <h1>Aikatauluohjelma – viivaesitys</h1>
      <p class="subtitle">Puhdas versio, jossa tuntiviivat ja tapahtumablokit lasketaan samasta mittakaavasta.</p>

      <div style="margin-bottom: 16px;">
        <label for="scheduleTitle">Aikataulun otsikko</label>
        <input type="text" id="scheduleTitle" placeholder="Esim. sähköyöaikataulu KOy merikallio" />
      </div>

      <form id="scheduleForm">
        <div class="form-grid">
          <div>
            <label for="timelineStart">Näkymä alkaa</label>
            <input type="time" id="timelineStart" value="06:00" />
          </div>
          <div>
            <label for="timelineEnd">Näkymä päättyy</label>
            <input type="time" id="timelineEnd" value="22:00" />
          </div>
          <div>
            <label for="date">Päivä</label>
            <input type="date" id="date" required />
          </div>
          <div>
            <label for="startTime">Alkaa</label>
            <input type="time" id="startTime" required />
          </div>
          <div>
            <label for="endTime">Päättyy</label>
            <input type="time" id="endTime" required />
          </div>
          <div>
            <label for="eventName">Tapahtuma</label>
            <input type="text" id="eventName" placeholder="Esim. Asiakaspalaveri" required />
          </div>
          <div>
            <label for="location">Paikka</label>
            <input type="text" id="location" placeholder="Esim. Neuvotteluhuone A" />
          </div>
          <div>
            <label for="owner">Vastuuhenkilö</label>
            <input type="text" id="owner" placeholder="Esim. Matti Meikäläinen" />
          </div>
        </div>

        <div style="margin-top: 12px;">
          <label for="notes">Lisätiedot</label>
          <textarea id="notes" placeholder="Esim. Muista materiaalit mukaan"></textarea>
        </div>

        <div class="actions">
          <button type="submit" id="submitBtn">Lisää aikatauluun</button>
          <button type="button" class="secondary" id="clearFormBtn">Tyhjennä lomake</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div style="margin-bottom: 16px;">
        <h2 id="printedScheduleTitle" style="margin: 0 0 6px 0;">Aikataulu</h2>
        <div id="printedScheduleSubtitle" class="view-note">Tulostettava otsikko näkyy myös PDF:ssä.</div>
      </div>

      <div class="toolbar no-print">
        <div>
          <h2 style="margin-bottom: 4px;">Viivaesitys</h2>
          <div class="view-note">Tapahtumien alku ja loppu lasketaan minuuttitarkasti samasta aikaskaalasta kuin tuntiviivat.</div>
        </div>
        <div class="search-box">
          <label for="search">Hae tapahtumista</label>
          <input type="text" id="search" placeholder="Hae nimellä, paikalla tai henkilöllä" />
        </div>
      </div>

      <div class="actions no-print" style="margin-top: 0; margin-bottom: 16px;">
        <button type="button" id="printBtn">Tulosta / Tallenna PDF</button>
        <button type="button" class="secondary" id="exportCsvBtn">Vie CSV</button>
        <button type="button" class="secondary" id="importCsvBtn">Tuo CSV</button>
        <input type="file" id="csvFileInput" accept=".csv,text/csv" style="display:none;" />
        <button type="button" class="danger" id="clearAllBtn">Poista kaikki</button>
      </div>

      <div class="timeline-wrapper" id="timelineContainer"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'aikatauluohjelma_timeline_clean_data';
    const SETTINGS_KEY = 'aikatauluohjelma_timeline_clean_settings';
    const DEFAULT_DAY_START = '06:00';
    const DEFAULT_DAY_END = '22:00';
    const DEFAULT_SCHEDULE_TITLE = 'Aikataulu';

    const form = document.getElementById('scheduleForm');
    const submitBtn = document.getElementById('submitBtn');
    const clearFormBtn = document.getElementById('clearFormBtn');
    const timelineStartInput = document.getElementById('timelineStart');
    const timelineEndInput = document.getElementById('timelineEnd');
    const searchTitleInput = document.getElementById('scheduleTitle');
    const printedScheduleTitle = document.getElementById('printedScheduleTitle');
    const printedScheduleSubtitle = document.getElementById('printedScheduleSubtitle');
    const searchInput = document.getElementById('search');
    const timelineContainer = document.getElementById('timelineContainer');
    const dateInput = document.getElementById('date');
    const startTimeInput = document.getElementById('startTime');
    const endTimeInput = document.getElementById('endTime');
    const eventNameInput = document.getElementById('eventName');
    const locationInput = document.getElementById('location');
    const ownerInput = document.getElementById('owner');
    const notesInput = document.getElementById('notes');
    const printBtn = document.getElementById('printBtn');
    const exportCsvBtn = document.getElementById('exportCsvBtn');
    const importCsvBtn = document.getElementById('importCsvBtn');
    const csvFileInput = document.getElementById('csvFileInput');
    const clearAllBtn = document.getElementById('clearAllBtn');

    let scheduleItems = loadItems();
    let timelineSettings = loadSettings();
    let editingItemId = null;

    function loadItems() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (error) {
        return [];
      }
    }

    function saveItems() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(scheduleItems));
    }

    function loadSettings() {
      try {
        return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {
          timelineStart: DEFAULT_DAY_START,
          timelineEnd: DEFAULT_DAY_END,
          scheduleTitle: DEFAULT_SCHEDULE_TITLE
        };
      } catch (error) {
        return {
          timelineStart: DEFAULT_DAY_START,
          timelineEnd: DEFAULT_DAY_END,
          scheduleTitle: DEFAULT_SCHEDULE_TITLE
        };
      }
    }

    function saveSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(timelineSettings));
    }

    function toMinutes(timeStr) {
      if (!timeStr) return 0;
      const [hours, minutes] = timeStr.split(':').map(Number);
      return (hours || 0) * 60 + (minutes || 0);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function getTimelineBounds() {
      const startMinutes = toMinutes(timelineSettings.timelineStart);
      const endMinutes = toMinutes(timelineSettings.timelineEnd);
      const safeEndMinutes = endMinutes > startMinutes ? endMinutes : startMinutes + 60;
      const totalMinutes = safeEndMinutes - startMinutes;
      const totalHours = Math.ceil(totalMinutes / 60);
      return { startMinutes, endMinutes: safeEndMinutes, totalMinutes, totalHours };
    }

    function getScaleWidthPx() {
      return getTimelineBounds().totalHours * parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hour-width'), 10);
    }

    function sortItems(items) {
      return [...items].sort((a, b) => `${a.date} ${a.startTime}`.localeCompare(`${b.date} ${b.startTime}`));
    }

    function groupByDate(items) {
      return items.reduce((acc, item) => {
        if (!acc[item.date]) acc[item.date] = [];
        acc[item.date].push(item);
        return acc;
      }, {});
    }

    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString + 'T00:00:00');
      return date.toLocaleDateString('fi-FI', {
        weekday: 'long',
        day: 'numeric',
        month: 'numeric',
        year: 'numeric'
      });
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function buildScaleHtml(showLabels = true) {
      const { totalHours, startMinutes } = getTimelineBounds();
      const scaleWidth = getScaleWidthPx();
      let html = `<div class="timeline-scale" style="width:${scaleWidth}px">`;

      for (let i = 0; i <= totalHours; i++) {
        const left = (i / totalHours) * 100;
        const labelHour = Math.floor(startMinutes / 60) + i;
        html += `<div class="scale-line" style="left:${left}%">`;
        if (showLabels && i < totalHours) {
          html += `<span class="scale-label">${String(labelHour % 24).padStart(2, '0')}:00</span>`;
        }
        html += `</div>`;
      }

      html += `</div>`;
      return html;
    }

    function getEventPlacement(item) {
      const { startMinutes, endMinutes, totalMinutes } = getTimelineBounds();
      const itemStart = clamp(toMinutes(item.startTime), startMinutes, endMinutes);
      const itemEnd = clamp(toMinutes(item.endTime), startMinutes, endMinutes);
      const leftPercent = ((itemStart - startMinutes) / totalMinutes) * 100;
      const widthPercent = Math.max(((itemEnd - itemStart) / totalMinutes) * 100, 1);
      return { leftPercent, widthPercent };
    }

    function updatePrintedHeader() {
      const title = (timelineSettings.scheduleTitle || '').trim() || DEFAULT_SCHEDULE_TITLE;
      printedScheduleTitle.textContent = title;
      printedScheduleSubtitle.textContent = `Tulostettava otsikko: ${title}`;
    }

    function renderTimeline() {
      const term = searchInput.value.trim().toLowerCase();
      const filtered = sortItems(scheduleItems).filter((item) => {
        const haystack = [item.date, item.startTime, item.endTime, item.eventName, item.location, item.owner, item.notes].join(' ').toLowerCase();
        return haystack.includes(term);
      });

      if (filtered.length === 0) {
        timelineContainer.innerHTML = '<div class="empty">Ei hakua vastaavia tapahtumia.</div>';
        return;
      }

      const groups = groupByDate(filtered);
      const dates = Object.keys(groups).sort();
      const scaleWidth = getScaleWidthPx();

      timelineContainer.innerHTML = dates.map((date) => {
        const items = sortItems(groups[date]);

        const rows = items.map((item) => {
          const placement = getEventPlacement(item);
          const locationText = item.location ? `Paikka: ${escapeHtml(item.location)}` : '';
          const ownerText = item.owner ? `Vastuuhenkilö: ${escapeHtml(item.owner)}` : '';
          const metaText = [locationText, ownerText].filter(Boolean).join('<br>');

          return `
            <div class="timeline-row">
              <div class="event-time">${escapeHtml(item.startTime)}–${escapeHtml(item.endTime)}</div>
              <div class="event-track" style="width:${scaleWidth}px">
                <div class="track-grid">${buildScaleHtml(false)}</div>
                <div class="track-line"></div>
                <div class="event-box" style="left:${placement.leftPercent}%; width:${placement.widthPercent}%">
                  <strong>${escapeHtml(item.eventName)}</strong>
                  ${metaText ? `<div class="event-meta">${metaText}</div>` : ''}
                  ${item.notes ? `<div class="event-notes">${escapeHtml(item.notes)}</div>` : ''}
                  <div class="row-actions no-print">
                    <button type="button" class="secondary" onclick="editItem('${item.id}')">Muokkaa</button>
                    <button type="button" class="danger" onclick="removeItem('${item.id}')">Poista</button>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');

        return `
          <section class="day-section">
            <div class="day-header">
              <div class="day-title">${formatDate(date)}</div>
              <div class="day-subtitle">${items.length} tapahtuma(a)</div>
            </div>
            <div class="timeline">
              <div class="timeline-header">
                <div class="time-header-cell"></div>
                ${buildScaleHtml()}
              </div>
              ${rows}
            </div>
          </section>
        `;
      }).join('');
    }

    function clearForm() {
      form.reset();
      editingItemId = null;
      submitBtn.textContent = 'Lisää aikatauluun';
      timelineStartInput.value = timelineSettings.timelineStart;
      timelineEndInput.value = timelineSettings.timelineEnd;
      searchTitleInput.value = timelineSettings.scheduleTitle || DEFAULT_SCHEDULE_TITLE;
      eventNameInput.focus();
    }

    function editItem(id) {
      const item = scheduleItems.find((entry) => entry.id === id);
      if (!item) return;
      editingItemId = id;
      submitBtn.textContent = 'Tallenna muutokset';
      dateInput.value = item.date;
      startTimeInput.value = item.startTime;
      endTimeInput.value = item.endTime;
      eventNameInput.value = item.eventName;
      locationInput.value = item.location || '';
      ownerInput.value = item.owner || '';
      notesInput.value = item.notes || '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      eventNameInput.focus();
    }

    function removeItem(id) {
      scheduleItems = scheduleItems.filter((item) => item.id !== id);
      if (editingItemId === id) clearForm();
      saveItems();
      renderTimeline();
    }

    function exportCsv() {
      const rows = sortItems(scheduleItems);
      if (rows.length === 0) {
        alert('Ei vietävää dataa.');
        return;
      }

      const header = ['Päivä', 'Alkaa', 'Päättyy', 'Tapahtuma', 'Paikka', 'Vastuuhenkilö', 'Lisätiedot'];
      const csvRows = [header, ...rows.map((item) => [item.date, item.startTime, item.endTime, item.eventName, item.location, item.owner, item.notes])];
      const csvContent = csvRows.map((row) => row.map((value) => `"${String(value ?? '').replace(/"/g, '""')}"`).join(';')).join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'aikataulu_viivaesitys.csv';
      link.click();
      URL.revokeObjectURL(url);
    }

    function parseCsvLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        const next = line[i + 1];
        if (char === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i += 1;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ';' && !inQuotes) {
          result.push(current);
          current = '';
        } else {
          current += char;
        }
      }

      result.push(current);
      return result;
    }

    function importCsvText(csvText) {
      const lines = csvText.split(/\r?\n/).filter((line) => line.trim());
      if (lines.length < 2) {
        alert('CSV-tiedostossa ei ole tuotavaa dataa.');
        return;
      }

      const imported = lines.slice(1).map(parseCsvLine).map((columns) => ({
        id: crypto.randomUUID(),
        date: (columns[0] || '').trim(),
        startTime: (columns[1] || '').trim(),
        endTime: (columns[2] || '').trim(),
        eventName: (columns[3] || '').trim(),
        location: (columns[4] || '').trim(),
        owner: (columns[5] || '').trim(),
        notes: (columns[6] || '').trim()
      })).filter((item) => item.date && item.startTime && item.endTime && item.eventName);

      if (imported.length === 0) {
        alert('CSV-tiedoston rivit eivät olleet oikeassa muodossa.');
        return;
      }

      scheduleItems = imported;
      saveItems();
      renderTimeline();
      alert(`Tuotiin ${imported.length} tapahtumaa.`);
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      if (timelineEndInput.value <= timelineStartInput.value) {
        alert('Näkymän päättymisajan pitää olla alkamisajan jälkeen.');
        return;
      }

      if (endTimeInput.value <= startTimeInput.value) {
        alert('Päättymisaika ei voi olla ennen tai sama kuin alkamisaika.');
        return;
      }

      timelineSettings.timelineStart = timelineStartInput.value;
      timelineSettings.timelineEnd = timelineEndInput.value;
      timelineSettings.scheduleTitle = searchTitleInput.value.trim() || DEFAULT_SCHEDULE_TITLE;
      saveSettings();
      updatePrintedHeader();

      const item = {
        id: editingItemId || crypto.randomUUID(),
        date: dateInput.value,
        startTime: startTimeInput.value,
        endTime: endTimeInput.value,
        eventName: eventNameInput.value.trim(),
        location: locationInput.value.trim(),
        owner: ownerInput.value.trim(),
        notes: notesInput.value.trim()
      };

      if (editingItemId) {
        scheduleItems = scheduleItems.map((entry) => entry.id === editingItemId ? item : entry);
      } else {
        scheduleItems.push(item);
      }

      saveItems();
      renderTimeline();
      clearForm();
    });

    searchInput.addEventListener('input', renderTimeline);

    searchTitleInput.addEventListener('input', () => {
      timelineSettings.scheduleTitle = searchTitleInput.value.trim() || DEFAULT_SCHEDULE_TITLE;
      saveSettings();
      updatePrintedHeader();
    });

    timelineStartInput.addEventListener('change', () => {
      if (timelineEndInput.value <= timelineStartInput.value) {
        alert('Näkymän päättymisajan pitää olla alkamisajan jälkeen.');
        timelineStartInput.value = timelineSettings.timelineStart;
        return;
      }
      timelineSettings.timelineStart = timelineStartInput.value;
      saveSettings();
      renderTimeline();
    });

    timelineEndInput.addEventListener('change', () => {
      if (timelineEndInput.value <= timelineStartInput.value) {
        alert('Näkymän päättymisajan pitää olla alkamisajan jälkeen.');
        timelineEndInput.value = timelineSettings.timelineEnd;
        return;
      }
      timelineSettings.timelineEnd = timelineEndInput.value;
      saveSettings();
      renderTimeline();
    });

    printBtn.addEventListener('click', () => window.print());
    exportCsvBtn.addEventListener('click', exportCsv);
    importCsvBtn.addEventListener('click', () => csvFileInput.click());
    clearFormBtn.addEventListener('click', clearForm);

    csvFileInput.addEventListener('change', async (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const text = await file.text();
      importCsvText(text);
      csvFileInput.value = '';
    });

    clearAllBtn.addEventListener('click', () => {
      if (!confirm('Haluatko varmasti poistaa kaikki tapahtumat?')) return;
      scheduleItems = [];
      saveItems();
      renderTimeline();
    });

    window.removeItem = removeItem;
    window.editItem = editItem;

    timelineStartInput.value = timelineSettings.timelineStart;
    timelineEndInput.value = timelineSettings.timelineEnd;
    searchTitleInput.value = timelineSettings.scheduleTitle || DEFAULT_SCHEDULE_TITLE;
    updatePrintedHeader();
    renderTimeline();
  </script>
</body>
</html>
