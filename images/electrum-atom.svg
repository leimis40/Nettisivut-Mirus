<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="360" viewBox="0 0 600 360">
  <title>Electrum — animoitu atomi</title>
  <desc>Kuparinhohtoinen ydin ja kolme hehkuvaa elektronia risteävillä kiertoradoilla.</desc>
  <defs>
    <radialGradient id="background">
      <stop stop-color="#203b4a"/>
      <stop offset="1" stop-color="#101d29"/>
    </radialGradient>
    <radialGradient id="aura">
      <stop stop-color="#edaa65" stop-opacity=".32"/>
      <stop offset=".4" stop-color="#df914e" stop-opacity=".1"/>
      <stop offset="1" stop-color="#df914e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="proton" cx="30%" cy="25%">
      <stop stop-color="#fff5d5"/>
      <stop offset=".35" stop-color="#f5bf7c"/>
      <stop offset="1" stop-color="#a94f24"/>
    </radialGradient>
    <radialGradient id="neutron" cx="30%" cy="25%">
      <stop stop-color="#f0fbff"/>
      <stop offset=".4" stop-color="#9bcbd9"/>
      <stop offset="1" stop-color="#376576"/>
    </radialGradient>
    <radialGradient id="electron-glow">
      <stop stop-color="#d2f8ff" stop-opacity=".8"/>
      <stop offset=".3" stop-color="#75d7f0" stop-opacity=".4"/>
      <stop offset="1" stop-color="#75d7f0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#a2c3d5" stroke-opacity=".055"/>
    </pattern>
    <!-- Motion and visible orbits share exactly the same ellipse. -->
    <path id="orbit-path" d="M162 0A162 52 0 1 1-162 0A162 52 0 1 1 162 0Z"/>
    <g id="electron-dot">
      <circle r="19" fill="url(#electron-glow)"/>
      <circle r="5" fill="#a6eeff"/>
      <circle cx="-1" cy="-1" r="2" fill="#fff"/>
    </g>
  </defs>
  <style>
    .core-aura { animation: breathe 5s ease-in-out infinite; }
    .still-electrons { display: none; }
    @keyframes breathe { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .moving-electron { display: none; }
      .still-electrons { display: inline; }
      .core-aura { animation: none; }
    }
  </style>
  <path fill="url(#background)" d="M0 0H600V360H0Z"/>
  <path fill="url(#grid)" d="M0 0H600V360H0Z"/>
  <g transform="translate(300 180)">
    <circle r="158" fill="none" stroke="#86b8cb" stroke-opacity=".09" stroke-dasharray="2 9"/>
    <path d="M-198 0H-178M178 0H198M0-164V-154M0 154V164" stroke="#8ebfd2" stroke-opacity=".3"/>
    <circle class="core-aura" r="110" fill="url(#aura)"/>
    <g fill="none" stroke-width="1.3">
      <use xlink:href="#orbit-path" stroke="#efb779" stroke-opacity=".7"/>
      <use xlink:href="#orbit-path" transform="rotate(60)" stroke="#85c9df" stroke-opacity=".65"/>
      <use xlink:href="#orbit-path" transform="rotate(120)" stroke="#c4d9e4" stroke-opacity=".5"/>
      <use xlink:href="#orbit-path" stroke="#efb779" stroke-width="6" stroke-opacity=".045"/>
      <use xlink:href="#orbit-path" transform="rotate(60)" stroke="#85c9df" stroke-width="6" stroke-opacity=".045"/>
      <use xlink:href="#orbit-path" transform="rotate(120)" stroke="#c4d9e4" stroke-width="6" stroke-opacity=".045"/>
    </g>
    <g class="moving-electron">
      <use xlink:href="#electron-dot"/>
      <animateMotion dur="6s" begin="-1s" repeatCount="indefinite"><mpath xlink:href="#orbit-path"/></animateMotion>
    </g>
    <g transform="rotate(60)">
      <g class="moving-electron">
        <use xlink:href="#electron-dot"/>
        <animateMotion dur="8s" begin="-4s" keyPoints="1;0" keyTimes="0;1" calcMode="linear" repeatCount="indefinite"><mpath xlink:href="#orbit-path"/></animateMotion>
      </g>
    </g>
    <g transform="rotate(120)">
      <g class="moving-electron">
        <use xlink:href="#electron-dot"/>
        <animateMotion dur="7s" begin="-5s" repeatCount="indefinite"><mpath xlink:href="#orbit-path"/></animateMotion>
      </g>
    </g>
    <g class="still-electrons">
      <use xlink:href="#electron-dot" transform="translate(162 0)"/>
      <use xlink:href="#electron-dot" transform="rotate(60) translate(-162 0)"/>
      <use xlink:href="#electron-dot" transform="rotate(120) translate(100 41)"/>
    </g>
    <g stroke="#101d29" stroke-opacity=".2" stroke-width=".7">
      <circle cx="-9" cy="-10" r="12" fill="url(#neutron)"/>
      <circle cx="10" cy="-8" r="12" fill="url(#proton)"/>
      <circle cx="17" cy="9" r="11" fill="url(#neutron)"/>
      <circle cx="-14" cy="10" r="12" fill="url(#proton)"/>
      <circle cx="2" cy="17" r="11" fill="url(#neutron)"/>
      <circle cx="1" cy="2" r="13" fill="url(#proton)"/>
    </g>
  </g>
  <g fill="#96c1d3" opacity=".35">
    <circle cx="91" cy="77" r="1.5"/><circle cx="482" cy="108" r="1"/>
    <circle cx="126" cy="278" r="1"/><circle cx="510" cy="273" r="1.5"/>
  </g>
</svg>
